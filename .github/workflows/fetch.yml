name: fetch

on:
  workflow_dispatch:
  # Schedule is disabled until the pipeline is verified end to end.
  # Mon/Thu 06:00 Asia/Taipei = Sun/Wed 22:00 UTC. GitHub cron is UTC
  # and may run tens of minutes late.
  # schedule:
  #   - cron: '0 22 * * 0,3'

permissions:
  contents: write

concurrency:
  group: fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Fetch sources
        run: node scripts/fetch.js
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. Without them Reddit falls back to RSS, which is mostly HTTP 429 on Actions.
          REDDIT_CLIENT_ID: ${{ secrets.REDDIT_CLIENT_ID }}
          REDDIT_CLIENT_SECRET: ${{ secrets.REDDIT_CLIENT_SECRET }}

      - name: Commit results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data state
          if git diff --cached --quiet; then
            echo 'No changes.'
            exit 0
          fi
          git commit -m "data: fetch $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
